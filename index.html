  html += '</div>';
  if(troopCount()===0) html += '<div class="empty-hint">士兵是数字编制，成批招募、战死会减员。先建帐篷营地，再招募一批守住营地。</div>';

  // ===== 英雄：只有「招募英雄」，不区分职业；无上限、8装备、5品级、不死 =====
  html += '<div class="sect-title">英雄（'+G.soldiers.length+' 位 · 永不战死，重伤疗养）</div>';
  html += '<div class="tile-grid">';
  html += '<div class="tile t-fuse"><div class="tile-head"><span class="tile-ic">英</span><span class="tile-name">招募英雄</span><span class="tile-tag">无上限</span></div>'+
    '<div class="tile-desc">有名字、会成长、带 8 件装备。永不战死，重伤只疗养。</div>'+
    '<div class="tile-meta"><span>造价 ×3</span><span>'+costStr(heroHireCost())+'</span></div>'+
    '<div class="tile-foot"><button class="btn-small" data-act="hero">招募英雄</button></div></div>';
  html += '</div>';
  const sorted = [...G.soldiers].sort((a,b)=>(b.lv-a.lv)||(soldierPower(b)-soldierPower(a)));
  if(sorted.length===0) html += '<div class="empty-hint">还没有英雄。英雄不会死，是队伍的核心。</div>';
  html += '<div class="tile-grid">';
  sorted.forEach(s=>{
    const stateTxt = { idle:"营地巡逻",patrol:"巡逻·"+(s.land>=0?LANDS[s.land].name:""),expedition:"出征中",healing:"疗养中"}[s.state];
    const hpc = s.hp>60?"":s.hp>30?"mid":"low";
    const title = soldierTitle(s);
    const tier = s.lv>=12?"mixed":s.lv>=8?"fuse":s.lv>=5?"unlock":"prod";
    const tierN = { prod:"新兵",unlock:"老练",fuse:"传奇",mixed:"传说" }[tier];
    const gear = (s.equip||[]).map(e=>e?'<span class="eq '+e.cls+'" title="'+e.name+' 战力+'+e.power+'"></span>':'<span class="eq qx" title="空槽"></span>').join('');
    html += '<div class="tile t-'+tier+' tile-hero">'+
      '<div class="tile-head"><span class="tile-ic">'+s.name.charAt(0)+'</span><span class="tile-name">'+s.name+'</span><span class="tile-tag">'+tierN+'</span></div>'+
      '<div class="tile-meta"><span>战力 '+Math.round(soldierPower(s))+'（装备+'+heroGearPower(s)+'）</span><span>Lv'+s.lv+'</span></div>'+
      '<div class="tile-desc"style="min-height:0">击杀 '+s.kills+' · '+stateTxt+' · XP '+Math.floor(s.xp)+'/'+xpNeed(s.lv)+'</div>'+
      '<div class="hpbar-bg"><div class="hpbar-fill '+hpc+'"style="width:'+Math.max(0,s.hp)+'%"></div></div>'+
      '<div class="eqgrid">'+gear+'</div>'+
      '</div>';
  });
  html += '</div>';
  // ===== 荣誉墙：普通士兵战死记录 =====
  html += '<div class="honor-title"> 荣誉墙（'+G.honorWall.length+'· 每5人信念+1/s 永久）</div>';
  if(G.honorWall.length===0) html += '<div class="empty-hint">还没有阵亡记录。</div>';
  else {
    html += '<div class="tile-grid">';
    G.honorWall.forEach(h=>{
      html += '<div class="tile t-done"><div class="tile-head"><span class="tile-ic">念</span><span class="tile-name">'+h.name+'</span></div>'+
        '<div class="tile-desc"style="min-height:0">'+h.type+' · 击杀'+h.kills+' · '+h.where+'</div></div>';
    });
    html += '</div>';
  }
  setHTML("rosterArea", html);
}
function renderLandsView() {
  setHTML("landsArea", LANDS.map((L,i)=>{
    const l = G.lands[i];
    const costStrL = costStr(L.cost);
    const rewardStrL = costStr(L.reward);
    const rateStrL = Object.entries(L.landRate||{}).map(([k,v])=>RES[k].n+fmtRate(v*S)).join("·");
    const pat = l.patrol.length;
    let btns = "";
    if(!l.liberated){
      const readyN = G.soldiers.filter(s=>s.state==="idle"||s.state==="patrol").length + troopCount();
      btns = '<button class="btn-small atk"'+(l.locked?' disabled':'')+' data-act="attack" data-i="'+i+'">'+(l.locked?'尚未开放':'全军出征（'+readyN+'人可战）')+'</button>';
    } else {
      btns = '<div style="font-size:11px;color:var(--text-secondary);margin-top:3px">巡逻队 '+pat+' 人 · 自动驻守</div>';
    }
    return '<div class="land-card '+(l.liberated?'liberated':'')+' '+(l.locked?'locked':'')+'">'+
      '<h4 style="margin:0 0 2px;font-size:13px">'+(i+1)+". "+L.name+' <span style="font-size:11px;color:var(--text-muted)">['+L.zone+']</span> '+(l.liberated?'<span style="color:var(--green);font-size:11px">已收复</span>':l.locked?'<span style="color:var(--text-muted);font-size:11px"></span>':'')+'</h4>'+
      '<div style="font-size:11px;color:var(--text-secondary)">'+L.set+'</div>'+
      '<div style="font-size:11px;color:var(--text-muted);margin:2px 0">守军战力 '+L.power+(l.liberated&&rateStrL?' | 特产：'+rateStrL:'')+'</div>'+
      (l.liberated?'':'<div style="font-size:11px;color:var(--text-muted)">出征消耗：'+costStrL+' ｜ 缴获：'+rewardStrL+'</div>')+btns+'</div>';
  }).join(''));
}
function nextResearch() {
  return RESEARCH.find(r=>{
    if(hasRes(r.id) || G.queue.includes(r.id)) return false;
    if(r.era>G.era) return false;
    if((r.id==="fade"||r.id==="sync"||r.id==="reson") && (G.B.facademy?G.B.facademy.count:0)===0) return false;
    if(r.up && (!G.B[r.up.b] || G.B[r.up.b].count===0)) return false;
    if(r.pre.includes("anyFusion")) return ["fade","sync","reson"].some(x=>hasRes(x));
    return r.pre.every(pp=>hasRes(pp));
  });
}
function researchKind(r){
  if(r.up) return "up";
  if(["fade","sync","reson"].includes(r.id) || (r.cost&&(r.cost.relics||r.cost.crystal))) return "fuse";
  if(/解锁/.test(r.d)) return "unlock";
  return "prod";
}
const RKIND_N = { up:"建筑",fuse:"融合",unlock:"解锁",prod:"生产" };
const RKIND_IC = { up:"建",fuse:"融",unlock:"解",prod:"研" };
function upTagFor(r){
  if(!r.up) return "";
  const b = BUILDINGS.find(x=>x.id===r.up.b);
  return '<span class="tile-tag">强化 · '+(b?buildingName(b,r.up.lv):r.up.b)+'</span>';
}
function renderResearchView() {
  const doneCount = RESEARCH.filter(r=>hasRes(r.id)).length;
  let html = '<div class="sect-title">研究档案（已完成 '+doneCount+'/'+RESEARCH.length+'· 当前 '+ERAS[G.era-1].n+'）</div>';
  const tile = (r, cls, extra) => {
    const k = researchKind(r);
    return '<div class="tile t-'+k+' '+cls+'">'+
      '<div class="tile-head"><span class="tile-ic">'+RKIND_IC[k]+'</span><span class="tile-name">'+r.n+'</span>'+upTagFor(r)+'</div>'+
      '<div class="tile-desc">'+r.d+'</div>'+
      extra+
      '</div>';
  };
  // 进行中的研究：只显示数字（剩余秒 / 进度百分比），不画进度条
  if(G.queue.length){
    html += '<div class="tile-grid">';
    G.queue.forEach(id=>{
      const r = RESEARCH.find(x=>x.id===id);
      if(!r) return;
      const left = Math.max(0,Math.ceil(r.t-G.R[id].prog));
      const pct = Math.min(100,Math.floor(G.R[id].prog/r.t*100));
      html += tile(r,'t-active','<div class="tile-meta"><span>剩余 '+left+'s</span><span>进度 '+pct+'%</span></div>');
    });
    html += '</div>';
  }
  // 摸索模式：只显示当前可研究的一项
  const avail = nextResearch();
  if(avail){
    const afford = canAfford(avail.cost);
    const can = G.queue.length<researchSlots();
    html += '<div class="sect-title">下一项研究</div><div class="tile-grid">';
    html += tile(avail,'','<div class="tile-meta"><span>耗时 '+Math.round(avail.t/60)+' 分钟</span><span>'+costStr(avail.cost)+'</span></div>'+
      '<div class="tile-foot">'+(can?'<button class="btn-small" data-act="research" data-id="'+avail.id+'"'+(afford?'':'disabled')+'>研究</button>':'<span class="tile-tag">研究进行中</span>')+'</div>');
    html += '</div>';
  } else if(!G.queue.length) {
    html += '<div class="empty-hint">当前纪元的知识已全部掌握。推进纪元或建造融合研究院以解锁新研究。</div>';
  }
  html += '<div class="sect-title">已完成研究</div>';
  const done = RESEARCH.filter(r=>hasRes(r.id));
  html += done.length ? '<div class="tile-grid">'+done.map(r=>tile(r,'t-done','<div class="tile-meta"><span>已完成</span></div>')).join('')+'</div>' :'<div class="empty-hint">尚无。</div>';
  setHTML("researchArea", html);
}
function renderLogStrip() {
  setHTML("logArea", '<div class="log-box">'+G.log.map(l=>'<p class="'+l.c+'">'+l.t+'</p>').join('')+'</div>');
}
function renderAllPanels() {
  renderRoster(); renderLandsView(); renderResearchView(); renderLogStrip();
}

function renderAll() {
  renderResBar();
  renderBuild();
  renderAllPanels();
  renderWorldTabs();
  const eb = document.getElementById("eraBadge");
  if(_lastEra!==G.era){
    eb.textContent = ERAS[G.era-1].n;
    eb.className = "era-badge t"+G.era+" sweep";
    clearTimeout(eb._sw); eb._sw=setTimeout(()=>eb.classList.remove("sweep"),950);
    _lastEra = G.era;
  }
}

// ---------- 启动 ----------
(function init(){
  const loaded = loadGame();
  CHEAT.on = localStorage.getItem(CHEAT.key)==="1";
  if(CHEAT.on){ CHEAT.fill(); checkEra(); } // 恢复作弊存档时也跳过门槛
  else {
    // 作弊已关闭：把被作弊推高的纪元拉回真实进度（兼容旧存档残留的 T5）
    const back = typeof G.eraBeforeCheat==="number" ? G.eraBeforeCheat : realEra();
    if(G.era>back) G.era = back;
    delete G.eraBeforeCheat;
  }
  // 事件委托：动态面板用 data-act 分发，避免每处 innerHTML 重建都重新绑定
  document.addEventListener("click", function(e){
    const t = e.target.closest ? e.target.closest("[data-act]") : null;
    if(!t || t.disabled) return;
    const act = t.dataset.act;
    if(act==="build") buildB(t.dataset.id);
    else if(act==="beacon") buildB("beacon");
    else if(act==="door") pushDoor();
    else if(act==="world") switchWorld(+t.dataset.i);
    else if(act==="troop") recruitTroop(t.dataset.id, +t.dataset.n);
    else if(act==="hero") recruitUnit();
    else if(act==="attack") attackLand(+t.dataset.i);
    else if(act==="research") startResearch(t.dataset.id);
  });
  CHEAT.badge(); CHEAT.listen();
  renderScrollList();
  renderAll();
  if(G.offlineNote){ showToast(""+G.offlineNote,"success"); addLog(""+G.offlineNote); }
  if(!loaded){
    addLog("远征队进入灰壤门");
  }
  setInterval(tick,1000);
  window.addEventListener("beforeunload",saveGame);
  if(document.getElementById("scrollPanel").classList.contains("expanded")){
    G.unread = 0;
    document.getElementById("scrollBadge").textContent = 0;
    renderScrollList();
  }
  adjustLeftPad();
  if(G.time===0 && !G.loreShown.start){
    // 开局记事（tick 3 也会兜底）
  }
})();
</script>
